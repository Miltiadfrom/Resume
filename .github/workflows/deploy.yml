name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Verify .NET version
        run: dotnet --version
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Publish
        run: dotnet publish -c Release -o build --nologo
      
      - name: List build output (DIAGNOSTICS)
        run: |
          echo "=== Contents of build/ ==="
          ls -la build/
          echo ""
          echo "=== Contents of build/wwwroot/ ==="
          ls -la build/wwwroot/ || echo "build/wwwroot does not exist!"
          echo ""
          echo "=== Contents of build/wwwroot/_framework/ ==="
          ls -la build/wwwroot/_framework/ || echo "_framework does not exist!"
          echo ""
          echo "=== File count in build/ ==="
          find build/ -type f | wc -l
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/wwwroot
      
      - name: Verify entry files exist
        run: |
          echo "=== First 15 files in _framework ==="
          ls build/wwwroot/_framework/ | head -15
          echo ""
          echo "=== Script tags in published index.html ==="
          grep -n "script" build/wwwroot/index.html || true
          echo ""
          test -f build/wwwroot/_framework/blazor.webassembly.js || { echo "::error::blazor.webassembly.js NOT found"; exit 1; }
          echo "OK: entry script present"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4